<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고구마켓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#8452D6; --brand-dark:#6438B0; --brand-deep:#3B1F63;
    --brand-tint:#F5F0FF; --brand-tint2:#E7DBFF;
    --gold:#FFC839; --gold-dark:#E8A200; --gold-tint:#FFF6DE;
    --bg:#FAFAFA; --card:#FFFFFF; --ink:#1D1E22; --ink-soft:#8B8D96;
    --line:#EDEDF1; --danger:#FF4D4D; --shadow: rgba(29,30,34,0.07);
  }
  /* ---------- 오염 모드 (관리자 전용 on/off, 색상 변수만 덮어써서 전체에 적용) ---------- */
  html.corrupted{
    --brand:#7A1FD6; --brand-dark:#4B0F8A; --brand-deep:#20051F;
    --brand-tint:#1B0E22; --brand-tint2:#301433;
    --gold:#8E2F2F; --gold-dark:#5C1414; --gold-tint:#2A0E12;
    --bg:#0A0510; --card:#150A1C; --ink:#E7D9F2; --ink-soft:#8A7397;
    --line:#2A1530; --danger:#FF2E2E; --shadow: rgba(0,0,0,0.7);
  }
  html.corrupted body{
    background:
      radial-gradient(1100px 560px at 12% -8%, rgba(122,31,214,0.22), transparent 60%),
      radial-gradient(900px 520px at 104% 6%, rgba(142,47,47,0.22), transparent 55%),
      radial-gradient(700px 500px at 50% 120%, rgba(122,31,214,0.16), transparent 60%),
      linear-gradient(180deg, #0A0510 0%, #05030A 45%);
  }
  html.corrupted .app{ box-shadow:0 24px 70px rgba(0,0,0,0.65), 0 1px 0 rgba(122,31,214,0.15) inset; }
  html.corrupted .brand-text h1,
  html.corrupted .modal h3,
  html.corrupted .detail-page-body h3,
  html.corrupted .post-title,
  html.corrupted .card-title,
  html.corrupted .section-head h2,
  html.corrupted .glitch-label{
    animation: glitchText 2.6s infinite;
    text-shadow: 1px 0 #ff2e6e, -1px 0 #2ee6ff;
  }
  html.corrupted .post-thumb img,
  html.corrupted .detail-image img,
  html.corrupted .img-preview{
    filter: grayscale(0.55) contrast(1.35) hue-rotate(265deg) brightness(0.6) saturate(1.4);
    animation: staticFlicker 3.4s infinite steps(1);
  }
  html.corrupted .app::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:5;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay; opacity:0.5; animation: noiseShift 0.5s steps(2) infinite;
  }
  @keyframes glitchText{
    0%, 92%, 100%{ text-shadow: 1px 0 #ff2e6e, -1px 0 #2ee6ff; transform:none; }
    93%{ text-shadow: 3px 0 #ff2e6e, -3px 0 #2ee6ff; transform:skewX(2deg); }
    95%{ text-shadow: -2px 0 #ff2e6e, 2px 0 #2ee6ff; transform:skewX(-2deg) translateX(-1px); }
    97%{ text-shadow: 2px 0 #ff2e6e, -2px 0 #2ee6ff; transform:translateY(1px); }
  }
  @keyframes staticFlicker{
    0%, 88%, 100%{ opacity:1; }
    90%{ opacity:0.55; }
    92%{ opacity:1; }
    94%{ opacity:0.7; }
  }
  @keyframes noiseShift{
    0%{ background-position:0 0; }
    100%{ background-position:0 3px; }
  }
  @media (prefers-reduced-motion: reduce){
    html.corrupted .brand-text h1, html.corrupted .modal h3, html.corrupted .detail-page-body h3, html.corrupted .post-title,
    html.corrupted .card-title, html.corrupted .section-head h2, html.corrupted .glitch-label,
    html.corrupted .post-thumb img, html.corrupted .detail-image img, html.corrupted .img-preview,
    html.corrupted .app::after{ animation:none; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    font-family:'Noto Sans KR', sans-serif; color:var(--ink);
    display:flex; justify-content:center; align-items:flex-start;
    padding:36px 20px;
    background:#F1F1F3;
  }
  .app{
    max-width:420px; width:100%; margin:0; background:var(--bg);
    position:relative;
    border-radius:28px; overflow:hidden;
    box-shadow:0 20px 50px rgba(29,30,34,0.14), 0 1px 0 rgba(255,255,255,0.6) inset;
    height:calc(100vh - 72px); height:calc(100dvh - 72px);
    display:flex; flex-direction:column;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:16px 16px 12px;
    background:var(--card);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:8px; min-width:0; }
  .logo-mascot{ width:34px; height:34px; flex-shrink:0; }
  .brand-text{ display:flex; align-items:baseline; gap:6px; min-width:0; }
  .brand-text h1{ font-family:'Noto Sans KR', sans-serif; font-weight:900; font-size:20px; margin:0; color:var(--brand); letter-spacing:-0.02em; }
  .brand-full{ margin:0; font-size:10.5px; font-weight:500; color:var(--ink-soft); white-space:nowrap; }
  .topbar-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .gumapay-chip{
    background:var(--brand-tint); border:1px solid var(--brand-tint2); border-radius:999px;
    padding:6px 12px 6px 7px; display:flex; align-items:center; gap:6px;
    cursor:pointer; font:inherit; -webkit-tap-highlight-color:transparent;
  }
  .gumapay-chip:hover{ border-color:var(--brand); }
  .gumapay-chip:focus-visible{ outline:2px solid var(--brand-dark); outline-offset:2px; }
  .gumapay-chip svg{ width:20px; height:20px; flex-shrink:0; }
  .gumapay-text{ display:flex; flex-direction:column; line-height:1.15; }
  .gumapay-label{ font-weight:700; font-size:9.5px; color:var(--brand-dark); }
  .gumapay-balance{ font-weight:700; font-size:13px; color:var(--ink); }

  /* ---------- Filter chips ---------- */
  .filters{ display:flex; gap:6px; padding:12px 16px 0; flex-wrap:wrap; flex-shrink:0; }
  .filters[hidden]{ display:none; }
  .chip-btn{
    font-weight:700; font-size:13px; background:var(--line); color:var(--ink-soft);
    border:none; border-radius:999px; padding:8px 14px; cursor:pointer; transition:background .12s ease,color .12s ease;
  }
  .chip-btn.active{ background:var(--brand); color:#fff; }
  .chip-btn:focus-visible{ outline:2px solid var(--brand-dark); outline-offset:2px; }

  main{ flex:1; min-height:0; overflow-y:auto; padding:14px 16px 100px; }
  .section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:10px; }
  .section-head h2{ font-weight:900; font-size:16px; margin:0; color:var(--ink); }

  .btn{ font-family:'Noto Sans KR', sans-serif; font-weight:700; border:none; cursor:pointer; border-radius:12px; padding:11px 16px; font-size:13.5px; transition:opacity .12s ease; }
  .btn:active{ opacity:0.85; }
  .btn:focus-visible{ outline:2px solid var(--brand-dark); outline-offset:2px; }
  .btn-primary{ background:var(--brand); color:#fff; }
  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-yellow{ background:var(--gold); color:#4A3300; }
  .btn-yellow:hover{ background:var(--gold-dark); }
  .btn-ghost{ background:none; color:var(--ink-soft); }
  .btn-ghost:hover{ color:var(--ink); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-small{ padding:6px 11px; font-size:11px; }
  .btn-outline{ background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn:disabled{ background:var(--line) !important; color:var(--ink-soft) !important; cursor:default; }

  /* ---------- Feed (flat list rows w/ divider, click for detail) ---------- */
  .feed{ display:flex; flex-direction:column; }
  .post-row{
    display:flex; align-items:center; gap:12px; background:transparent; border:none;
    border-bottom:1px solid var(--line); padding:14px 2px; cursor:pointer;
  }
  .post-row:last-child{ border-bottom:none; }
  .post-row:hover{ background:var(--brand-tint); margin:0 -8px; padding-left:10px; padding-right:10px; border-radius:12px; }
  .post-row:focus-visible{ outline:2px solid var(--brand-dark); outline-offset:-2px; border-radius:10px; }
  .post-row.static{ cursor:default; }
  .post-row.static:hover{ background:none; margin:0; padding:14px 2px; border-radius:0; }
  .post-thumb{ width:76px; height:76px; border-radius:12px; flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .post-thumb img{ width:100%; height:100%; object-fit:cover; }
  .thumb-sell{ background:var(--brand-tint); }
  .thumb-buy{ background:var(--gold-tint); }
  .post-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .post-type-label{ font-weight:700; font-size:10.5px; }
  .post-type-label.sell{ color:var(--brand-dark); }
  .post-type-label.buy{ color:var(--gold-dark); }
  .post-title{ font-weight:700; font-size:14.5px; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .post-meta{ font-size:12px; color:var(--ink-soft); margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .post-price{ font-weight:800; font-size:14.5px; color:var(--ink); margin-top:1px; }

  .empty{ text-align:center; padding:40px 12px; color:var(--ink-soft); font-size:13px; border:1.5px dashed var(--line); border-radius:16px; margin-top:8px; }

  /* ---------- 어둠 알바 / 가까운 어둠 (오염 모드 전용 게시판) ---------- */
  .mode-flash{ position:absolute; inset:0; z-index:45; background:#000; opacity:0; pointer-events:none; transition:opacity .08s ease; }
  .serious-italic{ font-family:'Gowun Batang', serif; font-style:italic; font-weight:700; display:inline-block; transform:skewX(-9deg); letter-spacing:0.5px; }
  .loading-msg{ padding:40px 12px; text-align:center; color:var(--ink-soft); font-size:13px; }

  /* ---------- Ledger tables (mypage) ---------- */
  .ledger-table{ width:100%; border-collapse:separate; border-spacing:0 6px; font-size:12px; }
  .ledger-table th{ text-align:left; font-weight:700; color:var(--brand-dark); font-size:10.5px; padding:0 10px 4px; }
  .ledger-table td{ background:var(--brand-tint); padding:8px 10px; border-top:1px solid var(--brand-tint2); border-bottom:1px solid var(--brand-tint2); }
  .ledger-table td:first-child{ border-left:1px solid var(--brand-tint2); border-radius:10px 0 0 10px; }
  .ledger-table td:last-child{ border-right:1px solid var(--brand-tint2); border-radius:0 10px 10px 0; }
  .ledger-table td.num{ font-family:'Noto Sans Mono', monospace; text-align:right; }
  .row-del{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:11px; }

  /* ---------- Floating write button ---------- */
  .fab-btn{
    position:absolute; bottom:74px; right:16px;
    width:52px; height:52px; border-radius:50%; background:var(--brand); color:#fff;
    border:none; box-shadow:0 8px 18px rgba(132,82,214,0.4); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; z-index:41;
    line-height:1;
  }
  .fab-btn:hover{ background:var(--brand-dark); }
  .fab-btn:focus-visible{ outline:2px solid var(--brand-deep); outline-offset:3px; }

  /* ---------- Bottom tab bar ---------- */
  .bottom-nav{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; background:var(--card);
    border-top:1px solid var(--line); z-index:39; padding-bottom:env(safe-area-inset-bottom,0);
  }
  .bottom-nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:none; border:none; cursor:pointer; padding:9px 4px 8px; color:var(--ink-soft);
  }
  .bottom-nav-item .bn-icon{ font-size:19px; line-height:1; }
  .bottom-nav-item .bn-label{ font-size:10px; font-weight:700; }
  .bottom-nav-item.active{ color:var(--brand); }
  .bottom-nav-item:focus-visible{ outline:2px solid var(--brand-dark); outline-offset:-2px; }

  /* ---------- Fixed admin corner ---------- */
  .admin-corner{ position:absolute; right:14px; bottom:140px; z-index:40; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .admin-corner-btn{
    font-weight:700; font-size:11px; background:var(--card); color:var(--ink-soft);
    border:1.5px solid var(--line); border-radius:999px; padding:7px 12px; cursor:pointer;
    box-shadow:0 2px 6px var(--shadow); opacity:0.9;
  }
  .admin-corner-btn:hover{ opacity:1; border-color:var(--brand); }
  .admin-corner-btn.on{ background:var(--brand); color:#fff; border-color:var(--brand); opacity:1; }

  /* ---------- Modal ---------- */
  .overlay{ position:absolute; inset:0; background:rgba(29,30,34,0.4); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .overlay[hidden]{ display:none; }
  .modal{ background:var(--bg); border-radius:20px; width:100%; max-width:400px; max-height:82%; overflow-y:auto; padding:22px 20px 20px; box-shadow:0 20px 50px rgba(0,0,0,0.25); }
  .modal h3{ font-weight:900; font-size:18px; margin:0 0 4px; color:var(--ink); }
  .modal p.hint{ margin:0 0 14px; font-size:12px; color:var(--ink-soft); line-height:1.5; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field textarea{ width:100%; font-family:'Noto Sans KR', sans-serif; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; }
  .field textarea{ resize:vertical; min-height:56px; }
  .field input:focus-visible, .field textarea:focus-visible{ outline:2px solid var(--brand); outline-offset:1px; }
  .error-msg{ color:var(--danger); font-size:12px; margin:-4px 0 10px; min-height:14px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .mypage-balance{ background:var(--brand); color:#fff; border-radius:14px; padding:14px 16px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
  .mypage-balance .num{ font-weight:800; font-size:20px; }
  .mypage-section-title{ font-weight:700; font-size:13px; color:var(--brand-dark); margin:16px 0 8px; }
  .mypage-empty{ font-size:12px; color:var(--ink-soft); padding:10px 4px; }
  .type-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .type-toggle button{ flex:1; font-weight:700; font-size:13.5px; border-radius:12px; padding:11px 6px; cursor:pointer; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); }
  .type-toggle button.selected.sell{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .type-toggle button.selected.buy{ background:var(--gold); color:#4A3300; border-color:var(--gold); }
  .img-preview{ width:100%; max-width:180px; border-radius:12px; margin-top:8px; display:none; object-fit:cover; }

  /* ---------- Detail page (full-screen slide-over, like Karrot's post screen) ---------- */
  .detail-page{
    position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .32s cubic-bezier(.22,.61,.36,1);
    z-index:44; pointer-events:none;
  }
  .detail-page.open{ transform:translateX(0); pointer-events:auto; }
  @media (prefers-reduced-motion: reduce){ .detail-page{ transition:none; } }
  .detail-page-header{
    display:flex; align-items:center; gap:4px; padding:10px 8px; border-bottom:1px solid var(--line);
    flex-shrink:0; background:var(--card);
  }
  .detail-back-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:none; font-size:20px;
    color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .detail-back-btn:hover{ background:var(--line); }
  .detail-back-btn:focus-visible{ outline:2px solid var(--brand-dark); outline-offset:2px; }
  .detail-page-title{ flex:1; text-align:center; font-weight:700; font-size:14px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .detail-page-spacer{ width:34px; flex-shrink:0; }
  .detail-page-body{ flex:1; overflow-y:auto; padding:16px 16px 28px; }
  .detail-page-footer{
    flex-shrink:0; border-top:1px solid var(--line); background:var(--card);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));
    display:flex; align-items:center; gap:10px;
  }
  body.detail-locked main{ overflow:hidden; }

  .detail-image{ width:100%; height:220px; border-radius:14px; overflow:hidden; background:var(--brand-tint); display:flex; align-items:center; justify-content:center; font-size:46px; margin-bottom:12px; }
  .detail-image img{ width:100%; height:100%; object-fit:cover; }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .tag-chip{ font-weight:700; font-size:10.5px; border-radius:999px; padding:3px 9px; }
  .tag-sell{ background:var(--brand-tint); color:var(--brand-dark); }
  .tag-buy{ background:var(--gold-tint); color:var(--gold-dark); }
  .tag-sold{ background:var(--line); color:var(--ink-soft); }
  .tag-done{ background:var(--line); color:var(--ink-soft); }
  .detail-meta{ font-size:11.5px; color:var(--ink-soft); margin:2px 0 10px; }
  .detail-row{ font-size:13px; margin:22px 0 10px; padding-top:16px; border-top:1px solid var(--line); }
  .detail-row strong{ font-weight:700; font-size:11.5px; color:var(--brand-dark); display:block; margin-bottom:2px; }
  .detail-desc{ font-size:13.5px; line-height:1.6; margin:0 0 14px; white-space:pre-wrap; word-break:break-word; }
  .detail-price-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%; }
  .price-pill-lg{ font-weight:900; font-size:19px; color:var(--ink); }
  .detail-actions{ display:flex; gap:8px; flex:1; flex-wrap:wrap; justify-content:flex-end; }

  @media (max-width:640px){
    body{ padding:0; background:var(--bg); }
    .app{ border-radius:0; box-shadow:none; max-width:100%; height:100vh; height:100dvh; }
  }
  @media (max-width:480px){
    .brand-text h1{ font-size:18px; }
    main{ padding:12px 12px 100px; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="logo-mascot" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="52" cy="20" rx="10" ry="6" fill="#8ED37B" transform="rotate(-20 52 20)"/>
        <ellipse cx="60" cy="16" rx="7" ry="4" fill="#7BC46A" transform="rotate(15 60 16)"/>
        <path d="M18,58 C12,32 32,12 54,16 C80,21 90,46 80,68 C72,86 42,92 25,80 C13,72 13,66 18,58 Z" fill="url(#gLogo)"/>
        <defs><linearGradient id="gLogo" x1="10" y1="10" x2="90" y2="90"><stop offset="0" stop-color="#B79CFF"/><stop offset="1" stop-color="#8452D6"/></linearGradient></defs>
        <ellipse cx="38" cy="62" rx="7" ry="4.5" fill="#FFB6C9" opacity="0.65"/>
        <ellipse cx="66" cy="58" rx="7" ry="4.5" fill="#FFB6C9" opacity="0.65"/>
        <circle cx="43" cy="52" r="3.4" fill="#3B1F63"/>
        <circle cx="64" cy="49" r="3.4" fill="#3B1F63"/>
        <path d="M48,63 Q54,68 60,61" stroke="#3B1F63" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <h1>구마</h1>
        <p class="brand-full corrupt-text">고구마켓</p>
      </div>
    </div>
    <div class="topbar-right">
      <button class="gumapay-chip" id="gumapayChip" type="button" aria-label="마이페이지로 구마pay 잔액 보기">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="#FFC839" stroke="#8452D6" stroke-width="2.2"/>
          <path d="M13,18 Q15,14 17,18" stroke="#6438B0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M23,18 Q25,14 27,18" stroke="#6438B0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M14,25 Q20,31 26,25" stroke="#6438B0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="gumapay-text">
          <span class="gumapay-label corrupt-text">구마pay</span>
          <span class="gumapay-balance corrupt-text" id="balanceText">0원</span>
        </div>
      </button>
    </div>
  </header>

  <nav class="filters" id="filtersNav">
    <button class="chip-btn active" data-filter="all">전체</button>
    <button class="chip-btn" data-filter="sell">팔아요</button>
    <button class="chip-btn" data-filter="buy">살게요</button>
  </nav>

  <main>
    <div class="section-head">
      <h2 id="boardTitle">동네 게시판</h2>
      <div id="sectionHeadActions"></div>
    </div>
    <div class="feed" id="feed">
      <div class="loading-msg">고구마 캐는 중…</div>

const CORRUPT_GLYPHS = '▒▓█░☒◍⟁⌬✦◈';
let corruptTextTimer = null;
let corruptProgress = 0;
function scrambleChar(){ return CORRUPT_GLYPHS[Math.floor(Math.random() * CORRUPT_GLYPHS.length)]; }
function scrambleString(str, ratio){
  return str.split('').map(ch => {
    if(ch === ' ' || ch === '\n') return ch;
    return Math.random() < ratio ? scrambleChar() : ch;
  }).join('');
}
function applyCorruptTick(){
  corruptProgress = Math.min(1, corruptProgress + 0.12);
  document.querySelectorAll('.corrupt-text').forEach(node => {
    if(node.dataset.original === undefined) node.dataset.original = node.textContent;
    node.textContent = scrambleString(node.dataset.original, corruptProgress);
  });
}
function startCorruptTextEffect(){
  if(corruptTextTimer) return;
  corruptProgress = 0;
  corruptTextTimer = setInterval(applyCorruptTick, 200);
}
function stopCorruptTextEffect(){
  if(corruptTextTimer){ clearInterval(corruptTextTimer); corruptTextTimer = null; }

    if(node.dataset.original !== undefined) node.textContent = node.dataset.original;

}

function flickerTransition(applyFn){
  const flash = el('modeFlash');
  if(!flash || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    applyFn();
    return;
  }
  const seq = [0.8, 0.15, 0.55, 0.05, 0.9, 0.2, 1, 0];
  const applyAtStep = 6; // 가장 어두운(불투명) 지점에서 실제 색상 전환
  let step = 0;
  function tick(){
    flash.style.opacity = String(seq[step]);
    if(step === applyAtStep) applyFn();
    step++;
    if(step < seq.length) setTimeout(tick, 90);
  }
  tick();
}
function showToastError(msg){ alert(msg || '저장 중 문제가 있었어요. 인터넷 연결을 확인하고 다시 시도해주세요.'); }

function imageFileToDataUrl(file){
  return new Promise((resolve) => {
    if(!file){ resolve(''); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > MAX_IMG_DIM){ h = Math.round(h * MAX_IMG_DIM / w); w = MAX_IMG_DIM; }
        else if(h >= w && h > MAX_IMG_DIM){ w = Math.round(w * MAX_IMG_DIM / h); h = MAX_IMG_DIM; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', IMG_QUALITY));
      };
      img.onerror = () => resolve('');
      img.src = e.target.result;
    };
    reader.onerror = () => resolve('');
    reader.readAsDataURL(file);
  });
}

/* ---------- Buy (sell-type posts, Firestore transaction) ---------- */
async function performPurchase(postId, buyerName){
  const postRef = doc(db, 'posts', postId);
  await runTransaction(db, async (t) => {
    const postSnap = await t.get(postRef);
    const walletSnap = await t.get(walletRef);
    if(!postSnap.exists()) throw new Error('missing');
    const post = postSnap.data();
    if(post.status === 'sold') throw new Error('sold');
    const balance = walletSnap.exists() ? (walletSnap.data().balance || 0) : 0;
    if(balance < post.price) throw new Error('short');
    t.update(postRef, { status: 'sold', buyerName });
    t.set(walletRef, { balance: balance - post.price }, { merge: true });
    const purchaseRef = doc(purchasesCol);
    t.set(purchaseRef, { postId, title: post.title, price: post.price, buyerName, purchasedAt: new Date().toISOString() });
  });
}

/* ---------- Charge (admin adds money, Firestore transaction) ---------- */
async function performCharge(sellerName, itemName, amount){
  await runTransaction(db, async (t) => {
    const walletSnap = await t.get(walletRef);
    const balance = walletSnap.exists() ? (walletSnap.data().balance || 0) : 0;
    t.set(walletRef, { balance: balance + amount }, { merge: true });
    const topupRef = doc(topupsCol);
    t.set(topupRef, { sellerName, itemName, amount, addedAt: new Date().toISOString() });
  });
}
function openChargeModal(){
  if(!isAdmin) return;
  openModal(`
    <h3>구마pay 충전하기</h3>
    <p class="hint">플레이어가 '살게요' 물건을 판다고 알려오면, 여기서 구마pay에 금액을 더해주세요.</p>
    <div class="field"><label for="sellerInput">판매한 사람</label><input type="text" id="sellerInput" maxlength="30"></div>
    <div class="field"><label for="itemInput">판 물건</label><input type="text" id="itemInput" maxlength="60"></div>
    <div class="field"><label for="amountInput">충전 금액 (원)</label><input type="number" id="amountInput" min="0" step="1"></div>
    <p class="error-msg" id="chargeError"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="chargeCancel">취소</button>
      <button class="btn btn-primary" id="chargeSubmit">충전하기</button>
    </div>
  `);
  el('sellerInput').focus();
  el('chargeSubmit').addEventListener('click', async () => {
    const sellerName = el('sellerInput').value.trim();
    const itemName = el('itemInput').value.trim();
    const amount = el('amountInput').value;
    if(!sellerName || !itemName){ el('chargeError').textContent = '판매한 사람과 물건을 모두 적어주세요.'; return; }
    if(amount === '' || Number(amount) <= 0){ el('chargeError').textContent = '충전 금액을 올바르게 적어주세요.'; return; }
    try{
      await performCharge(sellerName, itemName, Number(amount));
      await openMyPage();
    }catch(e){ el('chargeError').textContent = '충전 중 문제가 생겼어요. 다시 시도해주세요.'; }
  });
  el('chargeCancel').addEventListener('click', async () => { await openMyPage(); });
}

/* ---------- Deduct (admin removes money, Firestore transaction) ---------- */
async function performDeduct(amount){
  await runTransaction(db, async (t) => {
    const walletSnap = await t.get(walletRef);
    const balance = walletSnap.exists() ? (walletSnap.data().balance || 0) : 0;
    if(balance < amount) throw new Error('short');
    t.set(walletRef, { balance: balance - amount }, { merge: true });
  });
}

  if(!isAdmin) return;
  openModal(`

  el('deductAmountInput').focus();
  el('deductSubmit').addEventListener('click', async () => {

    try{
      await performDeduct(Number(amount));

    }catch(e){

  el('djTitleInput').focus();
  el('djSubmit').addEventListener('click', async () => {
    const title = el('djTitleInput').value.trim();
    const employerName = el('djEmployerInput').value.trim();
    const wage = el('djWageInput').value;
    if(!title || !employerName){ el('djError').textContent = '제목과 어둠 이름을 모두 적어주세요.'; return; }
    if(wage === '' || Number(wage) < 0){ el('djError').textContent = '시급을 올바르게 적어주세요.'; return; }
    try{
      await addDoc(darkJobsCol, { title, employerName, wage: Number(wage), createdAt: new Date().toISOString() });
      closeModal();
      renderJobsBoard();
    }catch(e){ el('djError').textContent = '등록 중 문제가 생겼어요. 다시 시도해주세요.'; }
  });
  el('djCancel').addEventListener('click', closeModal);
}

/* ---------- 가까운 어둠 게시판 (동네 게시판과 같은 자리에서 탭 전환, 상세 페이지 없음) ---------- */
async function fetchDarkPlaces(){
  const snap = await getDocs(query(darkPlacesCol, orderBy('createdAt', 'desc'), limit(100)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function renderPlacesBoard(){
  const feed = el('feed');
  feed.innerHTML = `<div class="loading-msg">어둠 찾는 중…</div>`;
  const places = await fetchDarkPlaces();
  if(currentBoard !== 'places') return;
  feed.innerHTML = renderDarkPlacesFeedHtml(places);
  bindDarkPlacesFeedEvents();
}
function renderDarkPlacesFeedHtml(places){
  if(places.length === 0){
    return `<div class="empty">📍 아직 감지된 어둠이 없어요.${isAdmin ? ' + 버튼으로 어둠을 등록해보세요.' : ''}</div>`;
  }
  return places.map(p => `
    <div class="post-row static">
      <div class="post-thumb thumb-buy">📍</div>
      <div class="post-main">
        <p class="post-title">${escapeHtml(p.name)}</p>
        <p class="post-meta">현재 위치로부터 ${escapeHtml(p.distance)}</p>
      </div>
      ${isAdmin ? `<button class="btn btn-ghost btn-small" data-dp-del="${p.id}">삭제</button>` : ''}
    </div>
  `).join('');
}
function bindDarkPlacesFeedEvents(){
  document.querySelectorAll('[data-dp-del]').forEach(b => {
    b.addEventListener('click', async () => {
      try{ await deleteDoc(doc(db, 'darkplaces', b.dataset.dpDel)); }
      catch(e){ showToastError('삭제 중 문제가 생겼어요.'); }
      renderPlacesBoard();
    });
  });
}
function openDarkPlaceFormModal(){
  if(!isAdmin) return;
  openModal(`
    <h3>가까운 어둠 등록</h3>
    <div class="field"><label for="dpNameInput">어둠 장소 이름</label><input type="text" id="dpNameInput" maxlength="40"></div>
    <div class="field"><label for="dpDistanceInput">현재 위치로부터 거리</label><input type="text" id="dpDistanceInput" maxlength="20" placeholder="예: 2.3km"></div>
    <p class="error-msg" id="dpError"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="dpCancel">취소</button>
      <button class="btn btn-primary" id="dpSubmit">등록하기</button>
    </div>
  `);
  el('dpNameInput').focus();
  el('dpSubmit').addEventListener('click', async () => {
    const name = el('dpNameInput').value.trim();
    const distance = el('dpDistanceInput').value.trim();
    if(!name || !distance){ el('dpError').textContent = '장소 이름과 거리를 모두 적어주세요.'; return; }
    try{
      await addDoc(darkPlacesCol, { name, distance, createdAt: new Date().toISOString() });
      closeModal();
      renderPlacesBoard();
    }catch(e){ el('dpError').textContent = '등록 중 문제가 생겼어요. 다시 시도해주세요.'; }
  });
  el('dpCancel').addEventListener('click', closeModal);
}

/* ---------- 오염 모드 (관리자 전용 on/off) ---------- */
el('corruptToggleBtn').addEventListener('click', async () => {
  if(!isAdmin || !settingsRef) return;
  const newValue = !corruptedMode;
  try{
    await setDoc(settingsRef, { corrupted: newValue }, { merge: true });
  }catch(e){ showToastError('오염 모드 전환 중 문제가 생겼어요.'); }
});

/* ---------- Boot (Firebase realtime listeners) ---------- */
function boot(){
  render();
  if(!isConfigured) return;
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  postsCol = collection(db, 'posts');
  walletRef = doc(db, 'meta', 'wallet');
  purchasesCol = collection(db, 'purchases');
  topupsCol = collection(db, 'topups');
  settingsRef = doc(db, 'meta', 'settings');
  darkJobsCol = collection(db, 'darkjobs');
  darkPlacesCol = collection(db, 'darkplaces');
  darkJobApplicationsCol = collection(db, 'darkjobapplications');

  onSnapshot(query(postsCol, orderBy('createdAt', 'desc')), (snap) => {
    marketData.posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderFeed();
  }, (err) => {
    console.error(err);
    el('feed').innerHTML = `<div class="empty">⚠️ 데이터를 불러오지 못했어요. Firebase 설정과 보안 규칙을 확인해주세요.</div>`;
  });

  onSnapshot(walletRef, (snap) => {
    marketData.balance = snap.exists() ? (snap.data().balance || 0) : 0;
    el('balanceText').textContent = formatWon(marketData.balance);
    el('balanceText').dataset.original = formatWon(marketData.balance);
    renderFeed();
  });

  let settingsInitialized = false;
  onSnapshot(settingsRef, (snap) => {
    const newVal = snap.exists() ? !!snap.data().corrupted : false;
    const applyMode = () => {
      corruptedMode = newVal;
      document.documentElement.classList.toggle('corrupted', corruptedMode);
      if(corruptedMode) startCorruptTextEffect(); else stopCorruptTextEffect();
      if(isAdmin){
        el('corruptToggleBtn').textContent = corruptedMode ? '오염 모드 ON' : '오염 모드 OFF';
        el('corruptToggleBtn').classList.toggle('on', corruptedMode);
      }
      if(!corruptedMode && currentBoard !== 'market') showMarketBoard();
    };
    if(!settingsInitialized || newVal === corruptedMode){
      settingsInitialized = true;
      applyMode();
    }else{
      flickerTransition(applyMode);
    }
  });
}
boot();
</script>
